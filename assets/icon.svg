<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <title>Gift Code Redeemer Icon</title>
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58ec87" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Bow Loops -->
  <path d="M 64 36 C 46 10 24 16 30 32 C 34 42 52 38 64 36 Z" fill="url(#limeGrad)" />
  <path d="M 64 36 C 82 10 104 16 98 32 C 94 42 76 38 64 36 Z" fill="url(#limeGrad)" />
  <rect x="57" y="30" width="14" height="12" rx="3" fill="#86efac" />

  <!-- Box Body -->
  <rect x="20" y="52" width="88" height="64" rx="6" fill="url(#boxGrad)" stroke="#58ec87" stroke-width="3" />

  <!-- Code brackets -->
  <path d="M 40 70 L 32 82 L 40 94" fill="none" stroke="#58ec87" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 88 70 L 96 82 L 88 94" fill="none" stroke="#58ec87" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vertical Ribbon Body -->
  <rect x="54" y="52" width="20" height="64" fill="url(#limeGrad)" />
  <rect x="61" y="52" width="6" height="64" fill="#86efac" fill-opacity="0.4" />

  <!-- Box Lid -->
  <rect x="14" y="36" width="100" height="19" rx="4" fill="url(#boxGrad)" stroke="#58ec87" stroke-width="3" />
  <!-- Vertical Ribbon Lid -->
  <rect x="54" y="36" width="20" height="19" fill="url(#limeGrad)" />
  <rect x="61" y="36" width="6" height="19" fill="#86efac" fill-opacity="0.4" />
</svg>
