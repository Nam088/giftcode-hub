<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>Gift Code Redeemer Marquee Banner</title>
  <defs>
    <linearGradient id="bgMarquee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="50%" stop-color="#0c0f15" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
    <linearGradient id="limeMarquee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58ec87" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <linearGradient id="boxGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2a3a" />
      <stop offset="100%" stop-color="#151c27" />
    </linearGradient>
    <linearGradient id="lidGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a394e" />
      <stop offset="100%" stop-color="#1c2635" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172230" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="url(#bgMarquee)" />
  <rect width="1400" height="560" fill="url(#grid)" />

  <!-- Subtle glow circles -->
  <circle cx="280" cy="280" r="180" fill="#58ec87" fill-opacity="0.06" filter="blur(60px)" />
  <circle cx="1100" cy="200" r="220" fill="#22c55e" fill-opacity="0.04" filter="blur(80px)" />

  <!-- Left: Large App Icon (centered at x=280, y=280, size 240x240) -->
  <g transform="translate(160, 160) scale(1.875)">
    <!-- Squircle container -->
    <rect width="128" height="128" rx="28" fill="#121822" stroke="#58ec87" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Ribbon Bow -->
    <path d="M 64 42 C 50 22 34 26 38 39 C 41 47 55 45 64 43 Z" fill="url(#limeMarquee)" />
    <path d="M 62 41 C 52 27 41 29 43 38 C 45 43 54 42 62 41 Z" fill="#86efac" fill-opacity="0.25" />
    
    <path d="M 64 42 C 78 22 94 26 90 39 C 87 47 73 45 64 43 Z" fill="url(#limeMarquee)" />
    <path d="M 66 41 C 76 27 87 29 85 38 C 83 43 74 42 66 41 Z" fill="#86efac" fill-opacity="0.25" />

    <!-- Center knot -->
    <rect x="58.5" y="38" width="11" height="10" rx="3" fill="#86efac" />
    <circle cx="64" cy="43" r="1.5" fill="#151c27" />

    <!-- Box Base -->
    <rect x="31" y="57" width="66" height="43" rx="4" fill="url(#boxGradM)" stroke="#2b3b50" stroke-width="1.5" />

    <!-- Code brackets on box front -->
    <path d="M 46 72 L 40 79 L 46 86" fill="none" stroke="#58ec87" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 82 72 L 88 79 L 82 86" fill="none" stroke="#58ec87" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tech circuit nodes -->
    <circle cx="43" cy="65" r="1.5" fill="#58ec87" fill-opacity="0.7" />
    <circle cx="85" cy="65" r="1.5" fill="#58ec87" fill-opacity="0.7" />

    <!-- Vertical Ribbon on Body -->
    <rect x="58" y="57" width="12" height="43" fill="url(#limeMarquee)" />
    <rect x="62.5" y="57" width="3" height="43" fill="#86efac" fill-opacity="0.45" />

    <!-- Box Lid -->
    <rect x="27" y="45" width="74" height="13" rx="3.5" fill="url(#lidGradM)" stroke="#374b66" stroke-width="1.5" />

    <!-- Vertical Ribbon on Lid -->
    <rect x="58" y="45" width="12" height="13" fill="url(#limeMarquee)" />
    <rect x="62.5" y="45" width="3" height="13" fill="#86efac" fill-opacity="0.45" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(480, 0)">
    <!-- Small Category Chip -->
    <rect x="0" y="160" width="168" height="30" rx="15" fill="#58ec87" fill-opacity="0.12" stroke="#58ec87" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="175" r="4" fill="#58ec87" />
    <text x="28" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#58ec87" letter-spacing="1.5">CHROME EXTENSION</text>

    <!-- App Title -->
    <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="1">GIFT CODE REDEEMER</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Fast, automated batch gift code redemption directly in your browser</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 345)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="44" rx="8" fill="#151d29" stroke="#253245" stroke-width="1" />
        <path d="M 22 22 L 28 28 L 38 17" fill="none" stroke="#58ec87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Batch Redeem</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(196, 0)">
        <rect width="190" height="44" rx="8" fill="#151d29" stroke="#253245" stroke-width="1" />
        <path d="M 22 22 L 28 28 L 38 17" fill="none" stroke="#58ec87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Auto Deduplication</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(402, 0)">
        <rect width="190" height="44" rx="8" fill="#151d29" stroke="#253245" stroke-width="1" />
        <path d="M 22 22 L 28 28 L 38 17" fill="none" stroke="#58ec87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Non-Stop Flow</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(608, 0)">
        <rect width="180" height="44" rx="8" fill="#151d29" stroke="#253245" stroke-width="1" />
        <path d="M 22 22 L 28 28 L 38 17" fill="none" stroke="#58ec87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Delta Force Ready</text>
      </g>
    </g>
  </g>
</svg>
