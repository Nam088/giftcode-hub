<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <title>Gift Code Redeemer Small Tile</title>
  <defs>
    <linearGradient id="bgSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
    <linearGradient id="limeSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58ec87" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <linearGradient id="boxGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2a3a" />
      <stop offset="100%" stop-color="#151c27" />
    </linearGradient>
    <linearGradient id="lidGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a394e" />
      <stop offset="100%" stop-color="#1c2635" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bgSmall)" />
  <rect x="1" y="1" width="438" height="278" rx="0" fill="none" stroke="#58ec87" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Center: Icon (100x100 scaled from 128) -->
  <g transform="translate(170, 32) scale(0.78125)">
    <!-- Squircle container -->
    <rect width="128" height="128" rx="28" fill="#141c28" stroke="#58ec87" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Ribbon Bow -->
    <path d="M 64 42 C 50 22 34 26 38 39 C 41 47 55 45 64 43 Z" fill="url(#limeSmall)" />
    <path d="M 62 41 C 52 27 41 29 43 38 C 45 43 54 42 62 41 Z" fill="#86efac" fill-opacity="0.25" />
    
    <path d="M 64 42 C 78 22 94 26 90 39 C 87 47 73 45 64 43 Z" fill="url(#limeSmall)" />
    <path d="M 66 41 C 76 27 87 29 85 38 C 83 43 74 42 66 41 Z" fill="#86efac" fill-opacity="0.25" />

    <!-- Center knot -->
    <rect x="58.5" y="38" width="11" height="10" rx="3" fill="#86efac" />
    <circle cx="64" cy="43" r="1.5" fill="#151c27" />

    <!-- Box Base -->
    <rect x="31" y="57" width="66" height="43" rx="4" fill="url(#boxGradS)" stroke="#2b3b50" stroke-width="1.5" />

    <!-- Code brackets on box front -->
    <path d="M 46 72 L 40 79 L 46 86" fill="none" stroke="#58ec87" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 82 72 L 88 79 L 82 86" fill="none" stroke="#58ec87" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="43" cy="65" r="1.5" fill="#58ec87" fill-opacity="0.7" />
    <circle cx="85" cy="65" r="1.5" fill="#58ec87" fill-opacity="0.7" />

    <!-- Vertical Ribbon on Body -->
    <rect x="58" y="57" width="12" height="43" fill="url(#limeSmall)" />
    <rect x="62.5" y="57" width="3" height="43" fill="#86efac" fill-opacity="0.45" />

    <!-- Box Lid -->
    <rect x="27" y="45" width="74" height="13" rx="3.5" fill="url(#lidGradS)" stroke="#374b66" stroke-width="1.5" />

    <!-- Vertical Ribbon on Lid -->
    <rect x="58" y="45" width="12" height="13" fill="url(#limeSmall)" />
    <rect x="62.5" y="45" width="3" height="13" fill="#86efac" fill-opacity="0.45" />
  </g>

  <!-- Typography -->
  <text x="220" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1.5">GIFT CODE REDEEMER</text>
  <text x="220" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Automated Batch Code Redemption</text>

  <!-- Badge pill -->
  <g transform="translate(140, 222)">
    <rect width="160" height="26" rx="13" fill="#58ec87" fill-opacity="0.12" stroke="#58ec87" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="13" r="3.5" fill="#58ec87" />
    <text x="28" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#58ec87" letter-spacing="1">CHROME EXTENSION</text>
  </g>
</svg>
