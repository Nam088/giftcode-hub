name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or release title (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint check
        run: pnpm lint

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: End-to-end integration tests (Playwright)
        run: pnpm e2e

  build-and-release:
    name: Build & Package Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension for Chrome
        run: pnpm zip

      - name: Package extension for Firefox
        run: pnpm zip:firefox

      - name: Generate SHA256 checksums
        run: |
          cd .output
          sha256sum *.zip > sha256sums.txt
          cat sha256sums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giftcode-extension-dist
          path: |
            .output/*.zip
            .output/sha256sums.txt

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "name=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Gift Code Redeemer ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            .output/*.zip
            .output/sha256sums.txt
            assets/promo-marquee.png
            assets/promo-small.png
            assets/icon-128.png
            assets/icon-512.png
            assets/icon.svg
            assets/store/en/*.png
            assets/store/vi/*.png
